name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish artifacts for"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify formatting
        run: |
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "gofmt needed for:"
            echo "$files"
            exit 1
          fi
      - name: Unit tests
        run: go test -race -count=1 ./...

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build proxy binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -trimpath \
            -ldflags "-s -w -X github.com/nonlog/ClinePassProxy/internal/version.Version=${TAG} -X github.com/nonlog/ClinePassProxy/internal/version.Commit=${GITHUB_SHA} -X github.com/nonlog/ClinePassProxy/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/clinepassproxy-linux-${{ matrix.arch }} \
            ./cmd/clinepassproxy
      - name: Checksums
        run: |
          cd dist
          sha256sum clinepassproxy-linux-${{ matrix.arch }} > clinepassproxy-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: clinepassproxy-linux-${{ matrix.arch }}
          path: dist/*

  connector:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            cc: gcc
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install cross toolchain
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build connector shared object
        env:
          CC: ${{ matrix.cc }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p connector-dist
          (cd cpa-connector && CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -buildmode=c-shared -trimpath \
            -ldflags "-s -w -X github.com/nonlog/ClinePassProxy/cpa-connector/internal/connector.Version=${TAG}" \
            -o ../connector-dist/clinepassproxy-connector-linux-${{ matrix.goarch }}.so \
            ./cmd/clinepassproxy-connector)
      - name: Checksums
        run: |
          cd connector-dist
          sha256sum * > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: connector-linux-${{ matrix.goarch }}
          path: connector-dist/*

  image:
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Inspect downloaded artifacts
        run: find dist -type f -maxdepth 2 | sort
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clinepassproxy
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [binaries, connector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Collect checksums
        run: |
          cd release
          find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**
          generate_release_notes: true
