<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-pref="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ClinePassProxy</title>
<script>
/* Resolve the theme before any CSS is applied so the first paint is already in
   the right theme. Mirrors js/theme.js; keep both in sync. */
(function () {
  var root = document.documentElement;
  var stored = "";
  try { stored = localStorage.getItem("clinepassproxy-theme") || ""; } catch (e) {}
  var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
  root.dataset.themePref = pref;
  function hostTheme() {
    try {
      var host = window.parent && window.parent !== window ? window.parent.document.documentElement : null;
      if (!host) return "";
      var attr = host.getAttribute("data-theme") || host.getAttribute("data-bs-theme") || "";
      if (attr === "light" || attr === "dark") return attr;
      return host.classList.contains("dark") ? "dark" : "";
    } catch (e) { return ""; }
  }
  var resolved = pref;
  if (pref === "system") {
    resolved = hostTheme() || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  root.dataset.theme = resolved;
})();
</script>
<!--assets:css-->
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">CP</span>
      <span class="brand-text">
        <strong>ClinePassProxy</strong>
        <small id="brand-version">—</small>
      </span>
    </div>
    <nav class="nav" id="nav">
      <button type="button" data-page="dashboard">概览</button>
      <button type="button" data-page="credentials">凭据</button>
      <button type="button" data-page="models">模型</button>
      <button type="button" data-page="requests">请求</button>
      <button type="button" data-page="usage">用量</button>
      <button type="button" data-page="settings">设置</button>
    </nav>
    <div class="sidebar-foot">
      <span class="pill" id="ready-pill">—</span>
      <span class="mono" id="commit-label"></span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">概览</h1>
        <p id="page-subtitle" class="muted"></p>
      </div>
      <div class="topbar-actions">
        <label class="field inline">
          <span class="muted">主题</span>
          <select id="theme-select">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <button type="button" class="btn" id="refresh-button">刷新</button>
        <span class="muted mono" id="updated-at"></span>
      </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>
<!--assets:js-->
</body>
</html>
