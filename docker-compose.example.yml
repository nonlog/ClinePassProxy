# Example deployment. Replace the management token placeholder before use; the
# real Cline credentials are added through the management UI, never here.
services:
  clinepassproxy:
    image: ghcr.io/nonlog/clinepassproxy:latest
    container_name: clinepassproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - clinepassproxy-data:/var/lib/clinepassproxy
    environment:
      CLINEPASSPROXY_DATA_DIR: /var/lib/clinepassproxy
      CLINEPASSPROXY_LISTEN: 0.0.0.0:8788
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clinepassproxy-data:
